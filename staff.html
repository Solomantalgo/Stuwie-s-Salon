<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff Dashboard | Stuwie's Salon &amp; Spa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--blue:#0064b4;--navy:#16304a;--ink:#172433;--muted:#6b7b8d;--line:#dce6ef;--wash:#eef3f8;--card:#fff;--green:#147d3f;--amber:#9a6418;--red:#a42620}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--wash);color:var(--ink);font:14px/1.45 Manrope,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #9bd3f5;outline-offset:2px}
    .shell{width:min(1180px,100%);margin:0 auto;padding:18px 14px 100px}.app-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}.eyebrow,.section-label{font-size:11px;font-weight:800;letter-spacing:1.35px;color:var(--blue)}h1{margin:4px 0 3px;font-size:26px;line-height:1.1;letter-spacing:-.5px}h2{margin:0;font-size:16px}p{margin:0}.intro{color:var(--muted)}.refresh{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--blue)}.refresh svg{width:19px}.refresh.loading svg{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .search{position:relative;margin-bottom:18px}.search input{display:block;width:100%;height:50px;padding:0 52px 0 15px;border:1px solid #cbd9e5;border-radius:12px;background:#fff;color:var(--ink);font-size:14px}.search input::placeholder{color:#718195;opacity:1}.search button{position:absolute;top:1px;right:1px;display:grid;place-items:center;width:46px;height:48px;border:0;border-radius:0 11px 11px 0;background:transparent;color:var(--blue)}.search button svg{width:18px}.search button span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    .summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:24px}.kpi{min-height:92px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left;color:var(--ink)}.kpi.active{border-color:var(--blue);box-shadow:0 0 0 2px rgba(0,100,180,.12)}.kpi-top{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;font-weight:700}.kpi-icon{display:grid;place-items:center;width:27px;height:27px;border-radius:9px;background:#e8f4fc;color:var(--blue)}.kpi-number{display:block;margin-top:8px;font-size:25px;line-height:1;font-weight:800}.kpi.pending{background:#fffaf1}.kpi.pending .kpi-icon{background:#fff0d2;color:var(--amber)}.kpi.attention{background:#fffaf1}.kpi.attention .kpi-icon{background:#fff0d2;color:var(--amber)}.kpi.confirmed{background:#f5fbf7}.kpi.confirmed .kpi-icon{background:#e1f4e8;color:var(--green)}
    .section{margin-top:22px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.section-head h2{font-size:12px;letter-spacing:1.3px;color:var(--blue)}.updated{font-size:11px;color:var(--muted)}.list{display:grid;gap:10px}.booking-card{display:block;width:100%;padding:13px 15px;text-decoration:none;cursor:pointer;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:0 5px 15px rgba(30,70,105,.04);color:var(--ink)}.booking-card:hover{border-color:#a9cce4}.booking-card,.booking-card *{text-decoration:none}.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.customer{font-size:16px;font-weight:800;line-height:1.2}.service{margin-top:3px;color:var(--muted);font-size:13px}.appointment{display:flex;align-items:center;gap:7px;margin-top:10px;color:#334c62;font-weight:700;font-size:13px}.appointment svg{width:16px;color:var(--blue);flex:none}.card-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;padding-top:9px;border-top:1px solid #edf1f5;color:var(--muted);font-size:12px}.payment-line{min-width:0;overflow-wrap:anywhere}.card-action{color:var(--blue);font-weight:800;white-space:nowrap;font-size:12px}.arrow{color:var(--blue);font-weight:800;white-space:nowrap}.pills{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px}.pill{display:inline-flex;align-items:center;min-height:23px;padding:3px 8px;border-radius:999px;background:#eaf4fb;color:#145b88;font-size:10px;font-weight:800;white-space:nowrap}.pill.new,.pill.pending,.pill.awaiting-payment,.pill.payment-initiated,.pill.mismatch{background:#fff0d2;color:var(--amber)}.pill.confirmed,.pill.paid-in-full,.pill.deposit-paid{background:#e1f4e8;color:var(--green)}.pill.cancelled,.pill.failed,.pill.payment-failed{background:#fde8e7;color:var(--red)}.empty{padding:13px 14px;border:1px dashed #c9d9e6;border-radius:14px;background:rgba(255,255,255,.55);text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:3px}.error{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border:1px solid #f0c9c5;border-radius:11px;background:#fff4f3;color:var(--red);font-size:13px}.retry{border:0;background:transparent;color:var(--red);font-weight:800;text-decoration:underline}.skeleton{height:92px;border-radius:14px;background:linear-gradient(90deg,#e8eef3,#f7fafc,#e8eef3);background-size:200% 100%;animation:shimmer 1.2s infinite}@keyframes shimmer{to{background-position:-200% 0}}
    .bottom-nav{position:fixed;z-index:10;right:0;bottom:0;left:0;display:grid;grid-template-columns:1fr 1fr;padding:8px max(14px,calc((100vw - 1180px)/2));background:rgba(255,255,255,.96);border-top:1px solid var(--line);box-shadow:0 -8px 22px rgba(20,49,80,.08)}.nav-item{min-height:48px;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:800}.nav-item.active{color:var(--blue)}.nav-item:disabled{opacity:.7}.nav-icon{display:block;margin:0 auto 2px;font-size:17px;line-height:1}
    @media(min-width:700px){.shell{padding:28px 24px 48px}.app-header{margin-bottom:22px}h1{font-size:32px}.search{max-width:700px}.summary{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.kpi{min-height:110px;padding:17px}.kpi-number{font-size:30px}.content-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:28px}.section{margin-top:8px}.bottom-nav{position:static;display:flex;justify-content:center;gap:8px;margin:32px auto 0;padding:0;border:0;box-shadow:none;background:transparent}.nav-item{width:150px;border:1px solid var(--line);border-radius:11px;background:#fff}.nav-item.active{border-color:#a9cce4}}
    @media(max-width:359px){.search button span{display:none}.search button{width:48px;justify-content:center;padding:0}.card-foot{align-items:flex-end;flex-direction:column}.pills{justify-content:flex-start}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="app-header"><div><div class="eyebrow">STUWIE'S SALON &amp; SPA</div><h1>Staff Dashboard</h1><p class="intro" id="greeting">Good morning<br>Here's what needs your attention today.</p></div><button class="refresh" id="refresh" type="button" aria-label="Refresh dashboard" title="Refresh dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8 8 0 0 0-14.9-3L3 11m0 0V5m0 6h6M4 13a8 8 0 0 0 14.9 3L21 13m0 0v6m0-6h-6"/></svg></button></header>
    <form class="search" id="searchForm"><input id="searchInput" type="search" placeholder="Search name, phone, ID or MoMo reference" autocomplete="off"><button type="submit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span>Search</span></button></form>
    <div id="error" hidden></div>
    <section aria-label="Booking summary"><div class="summary" id="summary"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></section>
    <div class="content-grid"><section class="section" id="attentionSection"><div class="section-head"><h2>NEEDS ATTENTION</h2><span class="updated" id="updated"></span></div><div class="list" id="attention"><div class="skeleton"></div><div class="skeleton"></div></div></section><section class="section" id="recentSection"><div class="section-head"><h2 id="recentTitle">RECENT BOOKINGS</h2><span class="updated" id="resultCount"></span></div><div class="list" id="recent"><div class="skeleton"></div><div class="skeleton"></div></div></section></div>
  </main>
  <nav class="bottom-nav" aria-label="Staff sections"><button class="nav-item active" type="button" onclick="location.href='staff.html'"><span class="nav-icon">⌂</span>Dashboard</button><button class="nav-item" type="button" onclick="location.href='today.html'"><span class="nav-icon">◷</span>Today</button></nav>
  <script src="config.js"></script>
  <script>
  (()=>{
    const fallback='https://script.google.com/macros/s/AKfycbxWzNJaHxmiTWEeFEmUt9OrhnyF-q30RZcZoKLGq_6B2RsPIo_Z36D9LdPVwhy0A4TO/exec';
    const configured=window.STUWIES_CONFIG&&typeof window.STUWIES_CONFIG.webAppUrl==='string'?window.STUWIES_CONFIG.webAppUrl.trim():'';const appUrl=configured||fallback;let allBookings=[],filter='',searchQuery='',summaryData={new:0,pending:0,paymentAttention:0,confirmed:0};let searchTimer;
    const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const iconCalendar='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4m8-4v4M3 9h18"/></svg>';
    function greeting(){const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'}$('greeting').innerHTML=esc(greeting())+'<br>Here&#39;s what needs your attention today.';
    function amount(v){if(v==null||v==='')return '';const n=Number(String(v).replace(/[^0-9.-]/g,''));return Number.isFinite(n)?'UGX '+n.toLocaleString('en-US'):''}
    function dateLabel(raw){if(!raw)return 'Date pending';const d=new Date(String(raw).slice(0,10)+'T00:00:00'),today=new Date();today.setHours(0,0,0,0);const tomorrow=new Date(today);tomorrow.setDate(today.getDate()+1);if(d.getTime()===today.getTime())return 'Today';if(d.getTime()===tomorrow.getTime())return 'Tomorrow';return d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'});}
    function timeLabel(raw){const m=String(raw||'').match(/^(\d{1,2}):(\d{2})/);if(!m)return raw||'Time pending';const d=new Date(2000,0,1,+m[1],+m[2]);return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});}
    function slug(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-')}
    function paymentAttention(b){const bookingStatus=String(b.bookingStatus||'').trim().toLowerCase();if(bookingStatus==='cancelled')return false;const p=String(b.paymentStatus||'').toLowerCase(),v=String(b.verificationStatus||'').toLowerCase();return v==='mismatch'||v==='failed'||p==='payment initiated'||p==='awaiting payment'||p==='payment failed'||(b.paymentType&&v==='pending')}
    function attention(b){const bookingStatus=String(b.bookingStatus||'').trim().toLowerCase();return paymentAttention(b)||bookingStatus==='new'||bookingStatus==='pending'}
    function card(b){const bookingStatus=b.bookingStatus||'New',paymentStatus=b.paymentStatus||'Unpaid',pay=amount(b.expectedAmount||b.amountPaid||b.balance);const params=new URLSearchParams({source:'staff',id:b.bookingId||'',name:b.customerName||'',phone:b.phone||'',email:b.email||'',service:b.service||'',items:b.selectedItems||'',date:b.preferredDate||'',time:b.preferredTime||'',location:b.location||'',notes:b.notes||'',payment_status:paymentStatus,payment_type:b.paymentType||'',payment_provider:b.provider||'',expected_amount:b.expectedAmount??'',amount_paid:b.amountPaid??0,balance:b.balance??''});const url='confirm.html?'+params.toString();return '<a class="booking-card" href="'+url+'"><div class="card-head"><div><div class="customer">'+esc(b.customerName||'Unnamed customer')+'</div><div class="service">'+esc(b.service||b.selectedItems||'Service not provided')+'</div></div><div class="pills"><span class="pill '+slug(bookingStatus)+'">'+esc(bookingStatus)+'</span><span class="pill '+slug(paymentStatus)+'">'+esc(paymentStatus)+'</span></div></div><div class="appointment">'+iconCalendar+'<span>'+esc(dateLabel(b.preferredDate))+' · '+esc(timeLabel(b.preferredTime))+'</span></div><div class="card-foot"><span class="payment-line">'+esc(pay||'Payment details unavailable')+'</span><span class="card-action">View details →</span></div></a>'}
    function empty(title,text){return '<div class="empty"><strong>'+esc(title)+'</strong>'+esc(text)+'</div>'}
    function render(){const source=filter?allBookings.filter(filterFn):allBookings,attentionItems=source.filter(attention).slice(0,8),counts=[["new","New",allBookings.filter(b=>String(b.bookingStatus).toLowerCase()==="new").length],["pending","Pending",allBookings.filter(b=>String(b.bookingStatus).toLowerCase()==="pending").length],["attention","Payment Attention",allBookings.filter(paymentAttention).length],["confirmed","Confirmed",allBookings.filter(b=>String(b.bookingStatus).toLowerCase()==="confirmed").length]];$("summary").innerHTML=counts.map(x=>"<button class=\"kpi "+x[0]+(filter===x[0]?" active":"")+"\" data-filter=\""+x[0]+"\"><span class=\"kpi-top\"><span>"+x[1]+"</span><span class=\"kpi-icon\">"+(x[0]==="confirmed"?"✓":x[0]==="attention"?"!":"•")+"</span></span><strong class=\"kpi-number\">"+x[2]+"</strong></button>").join("");$("attention").innerHTML=attentionItems.length?attentionItems.map(card).join(""):empty(searchQuery?"No matching booking found":(filter?"No "+filter+" bookings":"You're all caught up"),searchQuery?"Try a different name, phone, ID or reference.":(filter?"Try another filter.":"No bookings currently need attention."));const recent=source.slice(0,20);$("recent").innerHTML=recent.length?recent.map(card).join(""):empty(searchQuery?"No matching booking found":(filter?"No "+filter+" bookings":"No bookings yet."),searchQuery?"Try a different name, phone, ID or reference.":(filter?"Try another filter.":""));$("recentTitle").textContent=filter?filter.toUpperCase()+" BOOKINGS":"RECENT BOOKINGS";$("resultCount").textContent=filter?source.length+" result"+(source.length===1?"":"s"):"";$("summary").querySelectorAll(".kpi").forEach(k=>k.onclick=()=>{filter=filter===k.dataset.filter?"":k.dataset.filter;render()})}
    function filterFn(b){const s=String(b.bookingStatus||'').toLowerCase(),p=String(b.paymentStatus||'').toLowerCase(),v=String(b.verificationStatus||'').toLowerCase();if(s==='cancelled')return false;return filter==='new'?s==='new':filter==='pending'?s==='pending':filter==='confirmed'?s==='confirmed':filter==='attention'?(p==='payment initiated'||p==='awaiting payment'||p==='payment failed'||['pending','mismatch','failed'].includes(v)):true}
    function jsonp(url){return new Promise((resolve,reject)=>{const cb='__staff'+Date.now()+Math.floor(Math.random()*1000),script=document.createElement('script');window[cb]=data=>{delete window[cb];script.remove();resolve(data||{})};script.onerror=()=>{delete window[cb];script.remove();reject(Error('Request failed'))};script.src=url+'&callback='+cb;document.body.appendChild(script)})}
    async function load(q=''){searchQuery=q;$('refresh').classList.add('loading');$('error').hidden=true;try{const data=await jsonp(appUrl+'?action=staff_dashboard'+(q?'&q='+encodeURIComponent(q):''));if(!data.ok)throw Error(data.error||'Request failed');summaryData=data.summary||summaryData;allBookings=[...(data.results||[]),...(q?'':(data.attention||[])),...(q?'':(data.recent||[]))].filter((b,i,a)=>a.findIndex(x=>x.bookingId===b.bookingId)===i);allBookings.sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));$('updated').textContent='Updated just now';render()}catch(e){console.error(e);$('error').innerHTML='<div class="error"><span>Couldn&#39;t load bookings.</span><button class="retry" type="button">Try Again</button></div>';$('error').hidden=false}finally{$('refresh').classList.remove('loading')}}
    $('refresh').onclick=()=>load($('searchInput').value.trim());$('searchForm').onsubmit=e=>{e.preventDefault();clearTimeout(searchTimer);load($('searchInput').value.trim())};$('searchInput').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{const q=$('searchInput').value.trim();if(q)load(q);else load()},350)};load();
  })();
  </script>
</body>
</html>
