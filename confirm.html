<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Booking | Stuwie's Salon & Spa</title>
  <style>
    :root {
      --blue: #0064b4;
      --whatsapp: #25d366;
      --green: #147d3f;
      --red: #b42318;
      --warm: #b87521;
      --ink: #111827;
      --muted: #667085;
      --line: #d7e6f2;
      --wash: #f5f9fc;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: var(--wash);
      color: var(--ink);
      font-family: Arial, sans-serif;
    }
    main {
      width: min(420px, calc(100% - 32px));
      padding: 22px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 45px rgba(0, 46, 91, 0.12);
    }
    h1 {
      margin: 0 0 4px;
      font-size: 24px;
      letter-spacing: 0;
      text-align: center;
    }
    p {
      margin: 0 0 18px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }
    .actions {
      display: grid;
      gap: 10px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      min-height: 48px;
      padding: 12px 14px;
      border-radius: 6px;
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      text-align: left;
      border: 0;
      cursor: pointer;
      font: inherit;
      width: 100%;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn[disabled], .btn.loading { cursor: wait; opacity: 0.75; transform: none; }
    .icon {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
    }
    .btn-text { flex: 1; }
    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.45);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    .loading .spinner { display: block; }
    .black { background: #000; }
    .blue { background: var(--blue); }
    .whatsapp { background: var(--whatsapp); color: #05240f; }
    .whatsapp .spinner { border-color: rgba(5,36,15,0.25); border-top-color: #05240f; }
    .green { background: var(--green); }
    .red { background: var(--red); }
    .warm { background: var(--warm); }
    .status {
      min-height: 20px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <h1>Manage Booking</h1>
    <p id="bookingLabel">Choose an action</p>
    <section class="actions" aria-label="Booking actions">
      <a class="btn black" id="callCustomer" href="#"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 3.1 5.2 2 2 0 0 1 5.1 3h3a2 2 0 0 1 2 1.7l.5 2.8a2 2 0 0 1-.6 1.8l-1.3 1.3a16 16 0 0 0 4.7 4.7l1.3-1.3a2 2 0 0 1 1.8-.6l2.8.5a2 2 0 0 1 1.7 2Z"></path></svg><span class="btn-text">Call Customer</span></a>
      <a class="btn whatsapp" id="replyConfirm" href="#" target="_blank" rel="noreferrer"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5a8 8 0 0 1-11.8 7l-3.7 1 1-3.6A8 8 0 1 1 20 11.5Z"></path><path d="M9 8.8c.2 3 2.3 5.1 5.2 5.8l1.5-1.2"></path></svg><span class="btn-text">Reply on WhatsApp</span></a>
      <button class="btn green backend-action" id="markPaid" type="button" data-status="Paid"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path><path d="M3 6h18"></path><path d="M3 18h18"></path></svg><span class="btn-text">Mark Paid</span><span class="spinner" aria-hidden="true"></span></button>
      <button class="btn blue backend-action" id="confirmBooking" type="button" data-status="Confirmed"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M3 10h18"></path><path d="m9 16 2 2 4-5"></path></svg><span class="btn-text">Confirm Booking</span><span class="spinner" aria-hidden="true"></span></button>
      <button class="btn red backend-action" id="cancelBooking" type="button" data-status="Cancelled"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg><span class="btn-text">Cancel Booking</span><span class="spinner" aria-hidden="true"></span></button>
      <button class="btn warm backend-action" id="rescheduleBooking" type="button" data-status="Reschedule"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"></path><path d="M21 3v6h-6"></path><path d="M12 7v5l3 2"></path></svg><span class="btn-text">Reschedule</span><span class="spinner" aria-hidden="true"></span></button>
    </section>
    <div class="status" id="pageStatus"></div>
  </main>

  <script src="config.js"></script>
  <script>
    const DEFAULT_WEB_APP_URL = window.STUWIES_CONFIG.webAppUrl;
    const params = new URLSearchParams(window.location.search);
    function value(key, fallback = "") {
      const text = params.get(key);
      return text && text.trim() ? text.trim() : fallback;
    }
    function digitsOnlyPhone(phone) {
      let digits = String(phone || "").replace(/\D/g, "");
      if (digits.startsWith("0")) digits = `256${digits.slice(1)}`;
      return digits;
    }
    function actionUrl(status) {
      const app = value("app", DEFAULT_WEB_APP_URL);
      const id = value("id");
      return `${app}?action=booking_action&id=${encodeURIComponent(id)}&status=${encodeURIComponent(status)}`;
    }
    function actionJsonpUrl(status, callback) {
      return `${actionUrl(status)}&callback=${encodeURIComponent(callback)}`;
    }
    function serviceSummary() {
      const items = value("items");
      const service = value("service", "your service");
      if (!items) return service;
      const lines = items.split(/\r?\n/).filter(Boolean);
      return lines.length > 1 ? `${lines.length} selected services` : lines[0].replace(/^\d+\.\s*/, "").split(" - ")[0];
    }
    function whatsappConfirmUrl() {
      const digits = digitsOnlyPhone(value("phone"));
      const message = `Hi ${value("name")}, thank you for booking with Stuwie's Salon & Spa. To confirm your ${serviceSummary()} appointment on ${value("date")} at ${value("time")}, please send a 50% deposit. Your slot will be confirmed once payment is received.`;
      return digits ? `https://wa.me/${digits}?text=${encodeURIComponent(message)}` : "#";
    }
    function setBusy(button, busy) {
      button.disabled = busy;
      button.classList.toggle("loading", busy);
      button.setAttribute("aria-busy", String(busy));
    }
    function runBackendAction(button, status) {
      const bookingId = value("id");
      if (!bookingId) {
        document.getElementById("pageStatus").textContent = "Missing booking ID. Open this page from the booking email.";
        return;
      }
      setBusy(button, true);
      document.getElementById("pageStatus").textContent = `Updating booking to ${status}...`;
      const callback = `__stuwiesBookingAction${Date.now()}${Math.floor(Math.random() * 1000)}`;
      const script = document.createElement("script");
      window[callback] = (payload) => {
        setBusy(button, false);
        delete window[callback];
        script.remove();
        document.getElementById("pageStatus").textContent = payload && payload.ok
          ? `Booking updated to ${payload.status}.`
          : `Update failed: ${(payload && payload.error) || "Please try again."}`;
      };
      script.onerror = () => {
        setBusy(button, false);
        delete window[callback];
        script.remove();
        document.getElementById("pageStatus").textContent = "Update failed. Check your connection and try again.";
      };
      script.src = actionJsonpUrl(status, callback);
      document.body.appendChild(script);
    }

    const bookingId = value("id");
    document.getElementById("bookingLabel").textContent = bookingId ? `Booking ${bookingId}` : "Booking action page";
    const callDigits = digitsOnlyPhone(value("phone"));
    document.getElementById("callCustomer").href = callDigits ? `tel:+${callDigits}` : "#";
    document.getElementById("replyConfirm").href = whatsappConfirmUrl();
    document.querySelectorAll(".backend-action").forEach((button) => {
      button.addEventListener("click", () => runBackendAction(button, button.dataset.status));
    });
  </script>
</body>
</html>
