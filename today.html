<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Appointments | Stuwie's Salon &amp; Spa</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#0064b4;--ink:#172433;--muted:#6b7b8d;--line:#dce6ef;--wash:#eef3f8;--green:#147d3f;--amber:#9a6418;--red:#a42620}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--wash);color:var(--ink);font:14px/1.45 Manrope,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #9bd3f5;outline-offset:2px}.shell{width:min(760px,100%);margin:0 auto;padding:18px 14px 100px}.app-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}.eyebrow,.section-label{font-size:11px;font-weight:800;letter-spacing:1.35px;color:var(--blue)}h1{margin:4px 0 3px;font-size:26px;line-height:1.1;letter-spacing:-.5px}.refresh{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--blue)}.refresh svg{width:19px}.refresh.loading svg{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.date-title{font-size:18px;font-weight:800}.date-full{margin-top:2px;color:var(--muted);font-size:13px}.date-controls{display:grid;grid-template-columns:44px minmax(76px,1fr) 44px 44px;gap:8px;margin:13px 0 16px}.date-btn,.calendar-btn{height:42px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--blue);font-weight:800}.date-btn.today{font-size:12px}.date-btn.today.active{background:#e8f4fc;border-color:#a9cce4}.calendar-wrap{position:relative}.calendar-btn{display:grid;place-items:center;width:44px;font-size:18px}.native-date{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.summary-line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--muted);font-size:12px}.summary-line strong{color:var(--ink);font-size:13px}.summary-line .count{color:var(--blue);font-weight:800;white-space:nowrap}.updated{font-size:11px;color:var(--muted);white-space:nowrap}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.section-head h2{margin:0;font-size:12px;letter-spacing:1.3px;color:var(--blue)}
.timeline{position:relative}.timeline:before{content:"";position:absolute;top:10px;bottom:10px;left:70px;width:1px;background:#cbdce9}.appointment{position:relative;display:grid;grid-template-columns:58px minmax(0,1fr);gap:13px;margin-bottom:10px}.time{padding-top:16px;color:#334c62;font-size:12px;font-weight:800;text-align:right;white-space:nowrap}.dot{position:absolute;z-index:1;top:20px;left:66px;width:9px;height:9px;border:2px solid var(--wash);border-radius:50%;background:var(--blue)}.appointment.next .dot{background:var(--green);box-shadow:0 0 0 3px #dff3e6}.appointment-card{display:block;min-width:0;padding:13px 14px 12px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);text-decoration:none;box-shadow:0 5px 15px rgba(30,70,105,.04)}.appointment.next .appointment-card{border-color:#b9dfc7}.appointment.completed{opacity:.68}.appointment.past:not(.completed) .appointment-card{background:#fbfcfd}.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.next-label{display:block;margin-bottom:3px;color:var(--green);font-size:10px;font-weight:800;letter-spacing:1.1px}.customer{font-size:16px;font-weight:800;line-height:1.2;overflow-wrap:anywhere}.service{margin-top:4px;color:var(--muted);font-size:13px;overflow-wrap:anywhere}.professional{margin-top:5px;color:#718195;font-size:12px;overflow-wrap:anywhere}.pills{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px}.pill{display:inline-flex;align-items:center;min-height:23px;padding:3px 8px;border-radius:999px;background:#eaf4fb;color:#145b88;font-size:10px;font-weight:800;white-space:nowrap}.pill.new,.pill.pending,.pill.awaiting-payment,.pill.payment-initiated,.pill.mismatch{background:#fff0d2;color:var(--amber)}.pill.confirmed,.pill.paid-in-full,.pill.deposit-paid,.pill.paid{background:#e1f4e8;color:var(--green)}.attention .appointment-card{border-color:#edd6a6}.past-label{display:inline-block;margin-top:8px;color:var(--amber);font-size:11px;font-weight:700}.empty{padding:15px 14px;border:1px dashed #c9d9e6;border-radius:14px;background:rgba(255,255,255,.55);text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:3px}.error{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;padding:12px 14px;border:1px solid #f0c9c5;border-radius:11px;background:#fff4f3;color:var(--red);font-size:13px}.retry{border:0;background:transparent;color:var(--red);font-weight:800;text-decoration:underline}.skeleton{height:74px;margin-bottom:10px;border-radius:14px;background:linear-gradient(90deg,#e8eef3,#f7fafc,#e8eef3);background-size:200% 100%;animation:shimmer 1.2s infinite}@keyframes shimmer{to{background-position:-200% 0}}.bottom-nav{position:fixed;z-index:10;right:0;bottom:0;left:0;display:grid;grid-template-columns:1fr 1fr;padding:8px max(14px,calc((100vw - 760px)/2));background:rgba(255,255,255,.96);border-top:1px solid var(--line);box-shadow:0 -8px 22px rgba(20,49,80,.08)}.nav-item{min-height:48px;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:800}.nav-item.active{color:var(--blue)}.nav-icon{display:block;margin:0 auto 2px;font-size:17px;line-height:1}@media(min-width:700px){.shell{padding:28px 24px 48px}h1{font-size:32px}.bottom-nav{position:static;display:flex;justify-content:center;gap:8px;margin:32px auto 0;padding:0;border:0;box-shadow:none;background:transparent}.nav-item{width:150px;border:1px solid var(--line);border-radius:11px;background:#fff}.nav-item.active{border-color:#a9cce4}}@media(max-width:400px){.date-controls{grid-template-columns:42px minmax(68px,1fr) 42px 42px;gap:6px}.timeline:before{left:64px}.appointment{grid-template-columns:53px minmax(0,1fr);gap:12px}.dot{left:60px}.card-top{display:block}.pills{justify-content:flex-start;margin-top:9px}}
</style></head>
<body><main class="shell"><header class="app-header"><div><div class="eyebrow">STUWIE'S SALON &amp; SPA</div><h1>Appointments</h1></div><button class="refresh" id="refresh" type="button" aria-label="Refresh appointments" title="Refresh appointments"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8 8 0 0 0-14.9-3L3 11m0 0V5m0 6h6M4 13a8 8 0 0 0 14.9 3L21 13m0 0v6m0-6h-6"/></svg></button></header><section aria-label="Schedule date"><div class="date-title" id="dateTitle"></div><div class="date-full" id="dateFull"></div><div class="date-controls"><button class="date-btn" id="previous" type="button" aria-label="Previous day">‹</button><button class="date-btn today" id="today" type="button">Today</button><button class="date-btn" id="next" type="button" aria-label="Next day">›</button><div class="calendar-wrap"><button class="calendar-btn" id="calendarButton" type="button" aria-label="Choose a date">📅</button><input class="native-date" id="datePicker" type="date" aria-label="Choose schedule date"></div></div></section><div id="error" hidden></div><div class="summary-line" id="summary"><div><strong>Loading appointments</strong><br><span>Preparing today's schedule…</span></div><span class="count">—</span></div><section aria-label="Appointments"><div class="section-head"><h2>APPOINTMENTS</h2><span class="updated" id="updated"></span></div><div class="timeline" id="appointments"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></section></main><nav class="bottom-nav" aria-label="Staff sections"><button class="nav-item" type="button" onclick="location.href='staff.html'"><span class="nav-icon">⌂</span>Dashboard</button><button class="nav-item active" type="button" onclick="location.href='today.html'"><span class="nav-icon">◷</span>Today</button></nav>
<script src="config.js"></script><script>
(()=>{window.addEventListener('error',function(event){console.error('TODAY PAGE ERROR:',event.error||event.message);const errorBox=document.getElementById('error');if(errorBox){errorBox.innerHTML='<div class="error"><span>Page error: '+String(event.message||'Unknown JavaScript error')+'</span></div>';errorBox.hidden=false}});window.addEventListener('unhandledrejection',function(event){console.error('TODAY PROMISE ERROR:',event.reason);const errorBox=document.getElementById('error');if(errorBox){errorBox.innerHTML='<div class="error"><span>Request error: '+String(event.reason&&event.reason.message?event.reason.message:event.reason)+'</span></div>';errorBox.hidden=false}});const fallback='https://script.google.com/macros/s/AKfycbxWzNJaHxmiTWEeFEmUt9OrhnyF-q30RZcZoKLGq_6B2RsPIo_Z36D9LdPVwhy0A4TO/exec',appUrl=window.STUWIES_CONFIG&&window.STUWIES_CONFIG.webAppUrl?window.STUWIES_CONFIG.webAppUrl.trim():fallback,$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function pad(n){return String(n).padStart(2,'0')}function local(d=new Date()){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function date(raw){if(!/^\d{4}-\d{2}-\d{2}$/.test(raw||''))return null;const [y,m,day]=raw.split('-').map(Number),d=new Date(y,m-1,day);return d.getFullYear()===y&&d.getMonth()===m-1&&d.getDate()===day?d:null}function move(raw,n){const d=date(raw);d.setDate(d.getDate()+n);return local(d)}const today=local();const queryParams=new URLSearchParams(location.search);let selected=date(queryParams.get('date'))?queryParams.get('date'):today,current=[];label(selected);update();console.log('TODAY_INIT',selected,appUrl);function label(raw){const d=date(raw),t=raw===today,tm=raw===move(today,1),ys=raw===move(today,-1);$('dateTitle').textContent=t?"Today's Schedule":tm?"Tomorrow's Schedule":ys?"Yesterday's Schedule":'Schedule';$('dateFull').textContent=d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:d.getFullYear()===new Date().getFullYear()?undefined:'numeric'});$('today').classList.toggle('active',!t)}function time(raw){const m=String(raw||'').match(/^(\d{1,2}):(\d{2})/);if(!m)return raw||'Time pending';return new Date(2000,0,1,+m[1],+m[2]).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}function mins(raw){const m=String(raw||'').match(/^(\d{1,2}):(\d{2})/);return m?Number(m[1])*60+Number(m[2]):9999}function slug(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-')}function done(b){return String(b.bookingStatus||'').toLowerCase()==='completed'}function meaningfulProfessional(value){const normalized=String(value||'').trim().toLowerCase().replace(/—/g,'-').replace(/\s+/g,' ');return !!normalized&&!['no preference','no preference - salon to assign','salon to assign','none','not provided'].includes(normalized)}function cleanServiceName(line){return String(line||'').trim().replace(/^\d+[.)]\s*/,'').replace(/^[^:]+:\s*/,'').replace(/\s*·\s*\d+(?:\s*\/\s*\d+)?\s*(?:min|mins|minutes)\s*$/i,'').replace(/\s+-\s*(?:UGX\s*)?[\d,]+(?:\s*\/\s*(?:UGX\s*)?[\d,]+)*\s*$/i,'').trim()}function serviceNames(raw){const seen=new Set();return String(raw||'').split(/\r?\n/).map(cleanServiceName).filter(Boolean).filter(name=>{const key=name.toLowerCase();if(seen.has(key))return false;seen.add(key);return true})}function service(b){const selected=serviceNames(b.selectedItems),selectedText=selected.join(' · '),fallback=serviceNames(b.service);if(selected.length&&selectedText.toLowerCase()!=='multiple selected services')return selectedText;return fallback.length?fallback.join(' · '):'Service not provided'}function bookingUrl(b){const p=new URLSearchParams({source:'today',return_date:selected,id:b.bookingId||'',name:b.customerName||'',phone:b.phone||'',email:b.email||'',service:service(b),items:b.selectedItems||'',date:b.preferredDate||selected,time:b.preferredTime||'',professional:b.professional||'',booking_status:b.bookingStatus||'',notes:b.notes||'',payment_status:b.paymentStatus||'Unpaid',payment_type:b.paymentType||'',payment_provider:b.provider||'',expected_amount:b.expectedAmount??'',amount_paid:b.amountPaid??0,balance:b.balance??''});return'confirm.html?'+p}function next(i,b){if(selected!==today||done(b))return false;const now=new Date(),n=now.getHours()*60+now.getMinutes();return mins(b.preferredTime)>=n&&!current.slice(0,i).some(x=>!done(x)&&mins(x.preferredTime)>=n)}function render(data){current=data.appointments||[];const s=data.summary||{total:current.length,completed:current.filter(done).length,remaining:current.filter(x=>!done(x)).length};const isPast=selected<today,isToday=selected===today;const detail=isToday?s.completed+' completed · '+s.remaining+' remaining':isPast?s.completed+' completed · '+s.remaining+' not completed':s.completed+' completed';const cue=isToday?(s.total?s.remaining+' remaining':'Clear day'):isPast?(s.total?s.remaining+' not completed':'Clear day'):(s.total?s.completed+' completed':'Clear day');$('summary').innerHTML='<div><strong>'+s.total+' appointment'+(s.total===1?'':'s')+'</strong><br><span>'+detail+'</span></div><span class="count">'+cue+'</span>';if(!current.length){$('appointments').innerHTML='<div class="empty"><strong>No appointments scheduled</strong><span>There are no active appointments for '+esc($('dateFull').textContent)+'.</span></div>';return}const now=new Date(),nowMin=now.getHours()*60+now.getMinutes();$('appointments').innerHTML=current.map((b,i)=>{const c=done(b),n=next(i,b),past=selected===today&&!c&&mins(b.preferredTime)<nowMin,st=b.bookingStatus||'New',pay=b.paymentStatus||'Unpaid';return'<div class="appointment '+(c?'completed ':'')+(n?'next ':'')+(past?'past ':'')+(['new','pending'].includes(String(st).toLowerCase())?'attention':'')+'"><div class="time">'+esc(time(b.preferredTime))+'</div><span class="dot"></span><a class="appointment-card" href="'+bookingUrl(b)+'">'+(n?'<span class="next-label">NEXT</span>':'')+'<div class="card-top"><div><div class="customer">'+esc(b.customerName||'Unnamed customer')+'</div><div class="service">'+esc(service(b))+'</div>'+(meaningfulProfessional(b.professional)?'<div class="professional">With '+esc(b.professional)+'</div>':'')+'</div><div class="pills"><span class="pill '+slug(st)+'">'+esc(st)+'</span><span class="pill '+slug(pay)+'">'+esc(pay)+'</span></div></div>'+(past?'<div class="past-label">Time passed</div>':'')+'</a></div>'}).join('')}const SCHEDULE_CACHE_PREFIX='stuwies_schedule_';function readCache(dateKey){try{const raw=localStorage.getItem(SCHEDULE_CACHE_PREFIX+dateKey+'_v1'),entry=raw?JSON.parse(raw):null;return entry&&entry.payload&&Number.isFinite(entry.cachedAt)?entry:null}catch(e){console.warn('Schedule cache read failed',e);return null}}function writeCache(dateKey,payload){try{localStorage.setItem(SCHEDULE_CACHE_PREFIX+dateKey+'_v1',JSON.stringify({cachedAt:Date.now(),payload:payload}))}catch(e){console.warn('Schedule cache write failed',e)}}function isUsableCache(entry){return !!entry&&Date.now()-entry.cachedAt<24*60*60*1000}function jsonp(url){return new Promise((resolve,reject)=>{const cb='__today'+Date.now()+Math.floor(Math.random()*100000),script=document.createElement('script');let settled=false;const cleanup=()=>{try{delete window[cb]}catch(_){}if(script.parentNode)script.remove()};const timeout=setTimeout(()=>{if(settled)return;settled=true;cleanup();reject(new Error('Appointments request timed out.'))},15000);window[cb]=data=>{if(settled)return;settled=true;clearTimeout(timeout);cleanup();resolve(data||{})};script.onerror=()=>{if(settled)return;settled=true;clearTimeout(timeout);cleanup();reject(new Error('Appointments request failed.'))};script.src=url+'&callback='+encodeURIComponent(cb);document.body.appendChild(script)})}function update(){history.replaceState(null,'','today.html?date='+selected);$('datePicker').value=selected}function prefetchDate(dateKey){return jsonp(appUrl+'?action=staff_schedule&date='+dateKey).then(d=>{if(d&&d.ok)writeCache(dateKey,d)}).catch(()=>{})}async function load(options={}){console.log('TODAY_LOAD_START',selected);label(selected);update();const cached=readCache(selected),cacheShown=options.useCache!==false&&isUsableCache(cached);if(cacheShown){render(cached.payload);$('updated').textContent='Updating...'}$('refresh').classList.add('loading');$('error').hidden=true;try{const d=await jsonp(appUrl+'?action=staff_schedule&date='+selected);if(!d.ok)throw Error(d.error||'Request failed');console.log('TODAY_LOAD_SUCCESS',d);render(d);writeCache(selected,d);$('updated').textContent='Updated just now';prefetchDate(move(selected,-1));prefetchDate(move(selected,1))}catch(e){console.error('TODAY_LOAD_FAILURE',e);if(!cacheShown)$('appointments').innerHTML='';if(cacheShown){$('updated').textContent='Showing saved data'}else{$('error').innerHTML='<div class="error"><span>Couldn\'t load appointments.</span><button class="retry" type="button">Try Again</button></div>';$('error').hidden=false;$('error').querySelector('.retry').onclick=()=>load({useCache:false})}}finally{$('refresh').classList.remove('loading')}}$('previous').onclick=()=>{selected=move(selected,-1);load()};$('next').onclick=()=>{selected=move(selected,1);load()};$('today').onclick=()=>{selected=today;load()};$('refresh').onclick=()=>load({useCache:false});$('datePicker').onchange=e=>{if(date(e.target.value)){selected=e.target.value;load()}};try{$('calendarButton').onclick=()=>{const i=$('datePicker');if(i.showPicker)try{i.showPicker()}catch(e){console.warn('Calendar picker failed',e);i.click()}else i.click()}}catch(e){console.warn('Calendar setup failed',e)}load()})();
</script></body></html>
